name: Quality
on:
  pull_request:
  push:
    branches: ["feature/**", "fix/**", "docs/**", "chore/**", "perf/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:config
      - run: npm run test:db
      - run: npm run build
