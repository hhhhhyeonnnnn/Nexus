name: 기능 / 개발 작업
description: 범위와 완료 조건이 명확한 개발 작업을 제안합니다.
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 사용자 관점의 문제와 필요한 동작을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함할 작업과 이번에 제외할 작업을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 / 확인 방법
      placeholder: "- [ ] "
    validations:
      required: true
  - type: input
    id: design
    attributes:
      label: Figma / 관련 문서
